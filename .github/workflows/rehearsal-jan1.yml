name: Jan 1 Rehearsal (Safe Test)

# PRUEBA SEGURA del workflow de migración del 1 de enero.
# Replica los mismos pasos que auto-migration.yml PERO:
#   - SIN commit/push con git-auto-commit
#   - SIN deploy a Firebase
# No escribe NADA en Firebase (el script solo lee y escribe archivos locales efímeros).

on:
  workflow_dispatch:

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify FIREBASE_SERVICE_ACCOUNT secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ El secret FIREBASE_SERVICE_ACCOUNT no está configurado. FALLO."
            exit 1
          fi
          echo "✅ Secret FIREBASE_SERVICE_ACCOUNT presente (longitud $(echo -n "$FIREBASE_SERVICE_ACCOUNT" | wc -c))."

      - name: Run migration script (read-only vs Firebase)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: pnpm tsx src/scripts/githubMigration.ts

      - name: Set public VITE env vars for build
        run: cp .env.ci .env

      - name: Build to verify deploy step would work
        run: pnpm build