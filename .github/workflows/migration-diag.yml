name: Migration Hang Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run real migration with 120s timeout
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          timeout 120 pnpm tsx src/scripts/githubMigration.ts
          code=$?
          echo "MIGRATION_EXIT=$code"
          if [ "$code" = "124" ]; then
            echo "⛔ SE COLGÓ: el script no terminó en 120s"
          fi
          exit 0