name: Auto Migration & Deploy

on:
  schedule:
    # Se ejecuta cada 31 de diciembre a las 23:49 UTC (hora de Canarias)
    - cron: '49 23 31 12 *'
  workflow_dispatch:
    # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Migration Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: pnpm tsx src/scripts/githubMigration.ts

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-migration of previous year events and orchestras [skip ci]"
          file_pattern: 'public/events-archive/* public/orchestra-archive/*'

      - name: Build and Deploy to Firebase
        run: |
          pnpm build
          npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
